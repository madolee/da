<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>daily  script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=SUIT:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f4efe7;
      --paper:#fffaf3;
      --ink:#181512;
      --muted:#6f665d;
      --line:#d9cfc3;
      --accent:#a95f35;
      --accent-2:#d38b5f;
      --shadow:0 20px 60px rgba(63, 40, 22, 0.14);
      --radius:24px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'SUIT', sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top left, rgba(211,139,95,0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(169,95,53,0.10), transparent 28%),
        linear-gradient(180deg, #f8f2ea 0%, #f2ebe2 100%);
      min-height:100vh;
      overflow-x:hidden;
    }

    .grain{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.07;
      background-image:
        linear-gradient(rgba(0,0,0,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px);
      background-size: 6px 6px, 6px 6px;
      mix-blend-mode:multiply;
    }

    .wrap{
      width:min(1080px, calc(100% - 32px));
      margin:0 auto;
    }

    header{
      padding:28px 0 10px;
      animation:rise .8s ease both;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .eyebrow{
      font-size:.82rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700;
    }

    h1{
      margin:0;
      font-family:'Black Han Sans', sans-serif;
      font-size:clamp(2.2rem, 6vw, 4.8rem);
      line-height:.95;
      letter-spacing:-0.04em;
      font-weight:400;
    }

    .today-chip{
      padding:14px 18px;
      border:1px solid rgba(24,21,18,.09);
      background:rgba(255,250,243,.72);
      backdrop-filter: blur(10px);
      border-radius:999px;
      color:var(--ink);
      font-weight:700;
      box-shadow:var(--shadow);
      white-space:nowrap;
    }

    main{
      padding:18px 0 56px;
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:24px;
      align-items:start;
    }

    .panel{
      background:rgba(255,250,243,.78);
      border:1px solid rgba(24,21,18,.08);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(12px);
      overflow:hidden;
    }

    .memo-panel{
      animation:rise .8s .08s ease both;
    }

    .panel-head{
      padding:22px 22px 10px;
      border-bottom:1px solid rgba(24,21,18,.07);
    }

    .panel-title{
      margin:0 0 6px;
      font-size:clamp(1.2rem, 2.2vw, 1.8rem);
      line-height:1.1;
      font-weight:800;
      letter-spacing:-0.03em;
    }

    .panel-desc{
      margin:0;
      color:var(--muted);
      font-size:.96rem;
      line-height:1.6;
    }

    .memo-body{
      padding:22px;
    }

    .date-line{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:0 0 16px;
      margin-bottom:16px;
      border-bottom:1px dashed var(--line);
      color:var(--muted);
      font-size:.95rem;
    }

    .date-strong{
      color:var(--ink);
      font-weight:800;
      font-size:1.05rem;
    }

    textarea{
      width:100%;
      min-height:280px;
      resize:vertical;
      border:none;
      outline:none;
      background:#fffdf9;
      color:var(--ink);
      font: 500 1rem/1.8 'SUIT', sans-serif;
      padding:22px 20px;
      border-radius:20px;
      box-shadow: inset 0 0 0 1px rgba(24,21,18,.08);
      transition: box-shadow .25s ease, transform .25s ease, background .25s ease;
    }

    textarea:focus{
      box-shadow:
        inset 0 0 0 2px rgba(169,95,53,.45),
        0 0 0 8px rgba(169,95,53,.08);
      transform:translateY(-1px);
      background:#fff;
    }

    .actions{
      margin-top:16px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    button{
      appearance:none;
      border:none;
      cursor:pointer;
      font-family:'SUIT', sans-serif;
      font-weight:800;
      letter-spacing:-0.02em;
      padding:14px 18px;
      border-radius:999px;
      transition:transform .2s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
    }

    .save-btn{
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      color:#fffaf5;
      box-shadow:0 14px 30px rgba(169,95,53,.24);
    }

    .save-btn:hover{
      transform:translateY(-2px) scale(1.01);
      box-shadow:0 18px 34px rgba(169,95,53,.3);
    }

    .save-btn:active{
      transform:translateY(0) scale(.99);
    }

    .clear-btn{
      background:transparent;
      color:var(--ink);
      box-shadow: inset 0 0 0 1px rgba(24,21,18,.12);
    }

    .clear-btn:hover{
      background:#f2e7da;
      transform:translateY(-2px);
    }

    .status{
      margin-top:12px;
      min-height:24px;
      color:var(--muted);
      font-size:.93rem;
      font-weight:600;
    }

    .list-panel{
      animation:rise .8s .16s ease both;
    }

    .timeline{
      padding:6px 0;
      max-height:620px;
      overflow:auto;
    }

    .timeline::-webkit-scrollbar{width:10px}
    .timeline::-webkit-scrollbar-thumb{
      background:rgba(169,95,53,.26);
      border-radius:999px;
    }

    .entry{
      position:relative;
      padding:18px 22px 18px 58px;
      border-bottom:1px solid rgba(24,21,18,.06);
      animation:fadeUp .5s ease both;
    }

    .entry::before{
      content:"";
      position:absolute;
      left:26px;
      top:26px;
      width:10px;
      height:10px;
      border-radius:50%;
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow:0 0 0 6px rgba(169,95,53,.09);
    }

    .entry-time{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:8px;
      flex-wrap:wrap;
    }

    .time-badge{
      font-size:.88rem;
      font-weight:800;
      color:var(--accent);
      letter-spacing:.04em;
    }

    .entry-date{
      font-size:.86rem;
      color:var(--muted);
      font-weight:600;
    }

    .entry-text{
      margin:0;
      white-space:pre-wrap;
      word-break:break-word;
      line-height:1.75;
      color:var(--ink);
    }

    .empty{
      padding:28px 22px 34px;
      color:var(--muted);
      line-height:1.7;
    }

    footer{
      padding:0 0 34px;
      color:var(--muted);
      font-size:.88rem;
      animation:rise .8s .24s ease both;
    }

    .reveal{
      opacity:0;
      transform:translateY(18px);
      transition:opacity .7s ease, transform .7s ease;
    }

    .reveal.visible{
      opacity:1;
      transform:translateY(0);
    }

    @keyframes rise{
      from{opacity:0; transform:translateY(26px)}
      to{opacity:1; transform:translateY(0)}
    }

    @keyframes fadeUp{
      from{opacity:0; transform:translateY(10px)}
      to{opacity:1; transform:translateY(0)}
    }

    @media (max-width: 900px){
      main{
        grid-template-columns:1fr;
      }
      textarea{
        min-height:220px;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <div class="topbar">
        <div class="brand">
          <span class="eyebrow">Daily Memo</span>
          <h3>daily  script   today topic </h3>
        </div>
        <div class="today-chip" id="todayDisplay" aria-live="polite"></div>
      </div>
    </header>

    <main>
      <section class="panel memo-panel reveal" aria-labelledby="memoTitle">
        <div class="panel-head">
          <h2 class="panel-title" id="memoTitle">only text input </h2>
          <p class="panel-desc">recored  time and text.</p>
        </div>

        <div class="memo-body">
          <div class="date-line">
            <span>day of in text </span>
            <span class="date-strong" id="currentDateText"></span>
          </div>

          <label for="memoInput" class="sr-only" style="position:absolute;left:-9999px;">메모 입력</label>
          <textarea id="memoInput" placeholder="sample memo input here"></textarea>

          <div class="actions">
            <button type="button" class="save-btn" id="saveBtn">save</button>
            <button type="button" class="clear-btn" id="clearBtn">delete</button>
          </div>

          <div class="status" id="statusMsg" aria-live="polite"></div>
        </div>
      </section>

      <aside class="panel list-panel reveal" aria-labelledby="listTitle">
        <div class="panel-head">
          <h2 class="panel-title" id="listTitle">saved memo</h2>
          <p class="panel-desc">list   memo.</p>
        </div>
        <div class="timeline" id="memoList"></div>
      </aside>
    </main>

    <footer class="reveal">
      memo  html
    </footer>
  </div>

  <script>
    const todayDisplay = document.getElementById('todayDisplay');
    const currentDateText = document.getElementById('currentDateText');
    const memoInput = document.getElementById('memoInput');
    const saveBtn = document.getElementById('saveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const memoList = document.getElementById('memoList');
    const statusMsg = document.getElementById('statusMsg');

    const STORAGE_KEY = 'daily_memo_entries_v1';

    function formatKoreanDate(date) {
      return new Intl.DateTimeFormat('ko-KR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      }).format(date);
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat('ko-KR', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).format(date);
    }

    function formatShortDate(date) {
      return new Intl.DateTimeFormat('ko-KR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(date);
    }

    function setToday() {
      const now = new Date();
      todayDisplay.textContent = formatKoreanDate(now);
      currentDateText.textContent = formatKoreanDate(now);
    }

    function getMemos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveMemos(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function showStatus(message, isError = false) {
      statusMsg.textContent = message;
      statusMsg.style.color = isError ? '#b23a2b' : 'var(--muted)';
    }

    function renderMemos() {
      const memos = getMemos();

      if (memos.length === 0) {
        memoList.innerHTML = '<div class="empty">아직 저장된 메모가 없습니다.<br />왼쪽 텍스트 박스에 입력 후 저장해보세요.</div>';
        return;
      }

      memoList.innerHTML = memos.map((memo, index) => `
        <article class="entry" style="animation-delay:${index * 0.05}s">
          <div class="entry-time">
            <span class="time-badge">${memo.time}</span>
            <span class="entry-date">${memo.date}</span>
          </div>
          <p class="entry-text">${escapeHtml(memo.text)}</p>
        </article>
      `).join('');
    }

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    saveBtn.addEventListener('click', () => {
      const text = memoInput.value.trim();

      if (!text) {
        showStatus('메모 내용을 입력해주세요.', true);
        memoInput.focus();
        return;
      }

      const now = new Date();
      const newMemo = {
        text,
        date: formatShortDate(now),
        time: formatTime(now),
        timestamp: now.getTime()
      };

      const memos = getMemos();
      memos.unshift(newMemo);
      saveMemos(memos);
      renderMemos();

      memoInput.value = '';
      showStatus(`${newMemo.time}에 메모가 저장되었습니다.`);
    });

    clearBtn.addEventListener('click', () => {
      memoInput.value = '';
      memoInput.focus();
      showStatus('입력 내용이 지워졌습니다.');
    });

    memoInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        saveBtn.click();
      }
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    setToday();
    renderMemos();


function exportMemos() {
  const memos = localStorage.getItem('daily_memo_entries_v1');
  if (!memos) {
    alert('저장된 메모가 없습니다.');
    return;
  }
  const blob = new Blob([memos], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'daily_memos.json';
  a.click();
  URL.revokeObjectURL(url);
}

  </script>



<button type="button" id="downloadBtn">down load memo</button>



</body>
</html>
